[project]
name = "mediapipe"
version = "0.1.0"
description = "File & media processing service: presigned uploads, background processing, signed webhooks."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "boto3>=1.34",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pillow>=10.3",
    "pypdf>=4.2",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "moto[s3]>=5.0",
    "fakeredis>=2.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "boto3-stubs[s3]>=1.34",
    "celery-types>=0.22",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"app/processors/video.py" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "pypdfium2.*", "docx.*", "fakeredis.*", "moto.*"]
ignore_missing_imports = true
