# `docker compose up --build` starts the whole system.
# API: http://localhost:8000/docs   MinIO console: http://localhost:9001 (minioadmin / minioadmin)

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://mediapipe:mediapipe@postgres:5432/mediapipe
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  # Presigned URLs handed to clients must point at an address *they* can reach.
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_BUCKET: mediapipe
  ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
  WEBHOOK_ALLOW_PRIVATE_URLS: ${WEBHOOK_ALLOW_PRIVATE_URLS:-true}

x-app: &app
  build: .
  environment: *app-env
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio: {condition: service_healthy}

services:
  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *app-env
      S3_AUTO_CREATE_BUCKET: "true"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: celery -A app.workers.celery_app worker -Q celery,images,video,documents,webhooks -l info --concurrency 2

  beat:
    <<: *app
    command: celery -A app.workers.celery_app beat -l info -s /tmp/celerybeat-schedule

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mediapipe
      POSTGRES_PASSWORD: mediapipe
      POSTGRES_DB: mediapipe
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediapipe"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
